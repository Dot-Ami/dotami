# Keeps the pinned action hashes and npm dependencies current through pull requests that run
# the same gate as everything else. Security updates arrive as soon as an advisory lands;
# routine minor/patch bumps arrive once a week as one grouped PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major versions are deliberate work (the Next.js 14 -> 15 move took code changes and a
      # browser run); Dependabot proposes minors and patches only. Security advisories that
      # need a major still surface as alerts.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
