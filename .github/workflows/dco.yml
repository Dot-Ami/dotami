# Every commit in a pull request must carry a Signed-off-by line (DCO.md). No secrets needed,
# so it runs for forks too. Contributors add it with `git commit -s`.
name: DCO

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  signoff:
    name: Commits are signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every PR commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done
          exit $missing
