# The quality gate on the default branch and every PR — the same chain as `npm run ci:quality`.
# No secrets are needed, so PRs from forks run it too.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Prisma datasource URL is required for client init during `next build` bundling;
      # no database needs to be reachable for this CI smoke build.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dotami_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Fails a pull request that adds or upgrades to a dependency with a known high/critical
  # vulnerability, or one under a license the project cannot ship. Alerts on main are
  # Dependabot's job; this stops new ones arriving through a PR.
  dependency-review:
    name: Dependency review
    # Switched on by the repository variable DEPENDENCY_REVIEW=on once GitHub's dependency-graph
    # compare works for this repo (it answered 403 on 2026-09-20 although the graph itself is on).
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
