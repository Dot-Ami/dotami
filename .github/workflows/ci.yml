# The quality gate on the default branch and every PR — the same chain as `npm run ci:quality`.
# No secrets are needed, so PRs from forks run it too.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Stops the Prisma CLI reporting to checkpoint.prisma.io — `npm ci` runs it too, outside
      # the npm scripts that set this (scripts/prisma.mjs says what it would send).
      CHECKPOINT_DISABLE: "1"
      # Prisma needs a datasource URL for `next build`. SQLite makes the file on first use; the
      # database round-trip test migrates its own throwaway file in the temp folder.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The app built and started for real, driven in Chromium like a person would drive it
  # (playwright.config.ts, e2e/). Catches what the code-level tests can't: a page whose
  # scripts never run, a button that never enables, a save that doesn't survive a reload.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

  # The desktop app packaged for Windows and driven like a person drives it (e2e-desktop/):
  # start on an empty data folder → describe a venture → close → start again → still there.
  # The same packaging the release workflow uses, minus the installer and the upload.
  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Package the app and test it
        run: npm run desktop:package && npx playwright test -c playwright.desktop.config.ts
        env:
          DOTAMI_DESKTOP_EXE: ${{ github.workspace }}\dist-desktop\out\win-unpacked\DotAmi.exe

  # Fails a pull request that adds or upgrades to a dependency with a known high/critical
  # vulnerability, or one under a license the project cannot ship. Alerts on main are
  # Dependabot's job; this stops new ones arriving through a PR.
  dependency-review:
    name: Dependency review
    # Switched on by the repository variable DEPENDENCY_REVIEW=on once GitHub's dependency-graph
    # compare works for this repo (it answered 403 on 2026-09-20 although the graph itself is on).
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
