# OpenSSF Scorecard: an automated checklist of repository security practices (branch protection,
# pinned dependencies, token permissions, dangerous workflow patterns, known vulnerabilities,
# code review, SAST, …) scored 0–10 with the reasons. Results land in the Security tab and a
# public badge; the score is what a stranger checks before trusting a repo. Public repos only —
# it skips itself while the repository is private.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 7 * * 2" # Tuesdays 07:43 UTC
  # A 'Run workflow' button on the Actions tab, so a scan can be run by hand any time.
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload to the Security tab
      id-token: write # publish_results signs the result for the public badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
