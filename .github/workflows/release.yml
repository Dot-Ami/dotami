# Builds the Windows installer when a version tag is pushed (v0.2.0, or v0.2.0-dev.1 for a
# pre-release) and uploads it to a DRAFT GitHub release. Nothing reaches an installed app until
# the maintainer reads the draft and clicks Publish — that click is the gate for every update.
# How to release: docs/architecture/desktop-app.md § Releasing an update.
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # Only this job can write, and only to create the draft release and upload its files.
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: The tag matches the version in package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Package the app and test it like a person would
        run: npm run desktop:package && npx playwright test -c playwright.desktop.config.ts
        env:
          DOTAMI_DESKTOP_EXE: ${{ github.workspace }}\dist-desktop\out\win-unpacked\DotAmi.exe

      # electron-builder uploads its files in parallel and each upload made its own draft when none
      # existed yet — v0.2.0 came out as two drafts (installer + latest.yml in one, the blockmap in
      # the other). Making the one draft first gives every upload the same place to land.
      - name: Create the draft release first
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "DotAmi ${GITHUB_REF_NAME#v}" --notes "Release notes are written before this draft is published. Changes: CHANGELOG.md."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installer and upload it to the draft release
        run: node desktop/package.mjs --installer --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
