# Builds the Windows installer when a version tag is pushed (v0.2.0, or v0.2.0-dev.1 for a
# pre-release) and uploads it to a DRAFT GitHub release. Nothing reaches an installed app until
# the maintainer reads the draft and clicks Publish — that click is the gate for every update.
# How to release: docs/architecture/desktop-app.md § Releasing an update.
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # Only this job can write, and only to create the draft release and upload its files.
      contents: write
      # For the build provenance step below: a token from GitHub that proves which workflow and commit
      # this run is (Sigstore signs the statement with it), and the right to keep the statement with the
      # repository, where `gh attestation verify` finds it.
      id-token: write
      attestations: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: The tag matches the version in package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Package the app and test it like a person would
        run: npm run desktop:package && npx playwright test -c playwright.desktop.config.ts
        env:
          DOTAMI_DESKTOP_EXE: ${{ github.workspace }}\dist-desktop\out\win-unpacked\DotAmi.exe

      # electron-builder uploads its files in parallel and each upload made its own draft when none
      # existed yet — v0.2.0 came out as two drafts (installer + latest.yml in one, the blockmap in
      # the other). Making the one draft first gives every upload the same place to land.
      # A block (`run: |`), not a one-line value: the ": " in "Changes: CHANGELOG.md" made the
      # one-liner invalid YAML, and GitHub could not read this file at all (2026-10-06, #77).
      - name: Create the draft release first
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "DotAmi ${GITHUB_REF_NAME#v}" \
              --notes "Release notes are written before this draft is published. Changes: CHANGELOG.md."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installer and upload it to the draft release
        run: node desktop/package.mjs --installer --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance: a signed statement that this workflow, at this commit, built the installer with this
      # SHA-256, kept with the repository and in Sigstore's public log. Anyone can check a downloaded installer
      # with `gh attestation verify DotAmi-Setup-x.y.z.exe --repo Dot-Ami/dotami`. It is not code signing: the
      # installer is still unsigned, so Windows SmartScreen still warns, and the statement says which workflow
      # and commit built the file, not who published it (docs/architecture/desktop-app.md, the last section).
      # The pattern matches the one installer: electron-builder deletes the uninstaller it builds beside it, and
      # DotAmi.exe sits in win-unpacked/. The file is "DotAmi Setup x.y.z.exe" here and "DotAmi-Setup-x.y.z.exe"
      # on the release; the check matches the file's SHA-256, not its name.
      - name: Record where the installer was built (build provenance)
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-desktop/out/*.exe

      # The same statement as a file on the draft release, so the installer can also be checked against the
      # release's own copy (`--bundle DotAmi-Setup-x.y.z.exe.sigstore.json`). --clobber replaces it when a
      # tag's run is re-run.
      - name: Add the provenance file to the draft release
        shell: bash
        run: |
          name="DotAmi-Setup-${GITHUB_REF_NAME#v}.exe.sigstore.json"
          cp "$BUNDLE" "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
